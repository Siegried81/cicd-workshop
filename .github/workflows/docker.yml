name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:   # build only (no push) so a broken Dockerfile fails the PR

permissions:
  contents: read
  packages: write   # needed to push to GHCR on merge

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Only log in when we are actually going to push (never on a PR).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the image tags: short SHA (traceable), branch name, and semver on a tag.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      # On a PR: build and load locally (push: false). Elsewhere: push to GHCR.
      - name: Build (and push, except on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image is not necessarily a working one: start it and poll /health.
      - name: Smoke test the container
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name api -p 8000:8000 "$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
