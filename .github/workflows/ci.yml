name: CI

on:
  push:
    branches: [main]
  pull_request:

# Part C: cancel a run as soon as a newer commit lands on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Part E: least privilege. The jobs only need to read the code.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    # Part A: run the tests on three Python versions in parallel.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip  # Part B: reuse the pip download cache between runs.
      - run: pip install -e ".[serve,dev]"
      # Part D: measure coverage and write it to coverage.xml.
      - run: pytest --cov --cov-report=xml --cov-report=term-missing
      # Upload the report from one matrix entry only, so we keep a single artifact.
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  # One required check with a stable name. It is green only when lint and every
  # matrix test leg are green, so branch protection can require "ci-ok" and never
  # has to track the per-version check names (test (3.10), test (3.11)...).
  ci-ok:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.lint.result }}" = "success" ] \
          && [ "${{ needs.test.result }}" = "success" ] || exit 1
